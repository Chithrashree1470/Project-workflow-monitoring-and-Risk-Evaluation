<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Login | InfraSync AI</title><style>body{margin:0;background:#07111f;color:#e5e7eb;font-family:Arial}.box{max-width:430px;margin:90px auto;background:#0b1728;border:1px solid #1e293b;border-radius:16px;padding:30px}input{width:100%;box-sizing:border-box;margin:8px 0 16px;padding:12px;background:#07111f;color:white;border:1px solid #334155;border-radius:8px}button{width:100%;padding:13px;background:#38bdf8;border:0;border-radius:8px;font-weight:800}.error{color:#fb923c;margin-bottom:12px}</style></head><body><div class="box"><h1>Project Access</h1><p>Project ID: {{ project_id }}</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><label>Username</label><input name="username" required><label>Password</label><input type="password" name="password" required><button>Login</button></form></div></body></html>
