<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>InfraSync AI | Risk Assessment</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {

    font-family: Arial, sans-serif;

    background: #07111f;

    color: #e5e7eb;

    min-height: 100vh;
}


/* ==========================================================
   NAVBAR
========================================================== */

.navbar {

    height: 70px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 7%;

    border-bottom: 1px solid #1e293b;
}


.logo {

    color: #38bdf8;

    font-size: 22px;

    font-weight: bold;
}


.nav-links {

    display: flex;

    gap: 25px;
}


.nav-links a {

    color: #cbd5e1;

    text-decoration: none;
}


.nav-links a:hover {

    color: #38bdf8;
}


/* ==========================================================
   CONTAINER
========================================================== */

.container {

    width: 90%;

    max-width: 1100px;

    margin: 40px auto 70px;
}


h1 {

    font-size: 32px;

    margin-bottom: 10px;
}


.subtitle {

    color: #94a3b8;

    margin-bottom: 30px;
}


/* ==========================================================
   CARD
========================================================== */

.form-card {

    background: #0b1728;

    border: 1px solid #1e293b;

    border-radius: 18px;

    padding: 30px;
}


.section-title {

    color: #38bdf8;

    font-size: 20px;

    margin-bottom: 22px;

    padding-bottom: 10px;

    border-bottom: 1px solid #1e293b;
}


.section {

    margin-bottom: 35px;
}


/* ==========================================================
   GRID
========================================================== */

.form-grid {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 20px;
}


.form-group {

    display: flex;

    flex-direction: column;
}


.form-group.full {

    grid-column: 1 / -1;
}


/* ==========================================================
   LABEL
========================================================== */

label {

    margin-bottom: 8px;

    color: #cbd5e1;

    font-size: 14px;

    font-weight: 600;
}


/* ==========================================================
   INPUTS
========================================================== */

input,
select {

    width: 100%;

    padding: 13px 14px;

    background: #07111f;

    color: #e5e7eb;

    border: 1px solid #334155;

    border-radius: 9px;

    outline: none;

    font-size: 14px;
}


input:focus,
select:focus {

    border-color: #38bdf8;
}


input::placeholder {

    color: #64748b;
}


/* ==========================================================
   REMOVE NUMBER SPINNER
========================================================== */

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {

    -webkit-appearance: none;

    margin: 0;
}


input[type="number"] {

    -moz-appearance: textfield;
}


/* ==========================================================
   READONLY FIELDS
========================================================== */

input[readonly] {

    background: #101d30;

    color: #38bdf8;

    font-weight: bold;
}


/* ==========================================================
   OTHER BOX
========================================================== */

.other-box {

    display: none;

    margin-top: 10px;
}


/* ==========================================================
   SUMMARY
========================================================== */

.summary {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 15px;

    margin-top: 25px;
}


.summary-box {

    background: #07111f;

    border: 1px solid #1e293b;

    border-radius: 10px;

    padding: 15px;
}


.summary-box span {

    display: block;

    color: #94a3b8;

    font-size: 12px;

    margin-bottom: 7px;
}


.summary-box strong {

    color: #38bdf8;

    font-size: 17px;
}


/* ==========================================================
   BUTTON
========================================================== */

.submit-area {

    text-align: center;

    margin-top: 30px;
}


button {

    padding: 14px 40px;

    border: none;

    border-radius: 9px;

    background: #38bdf8;

    color: #07111f;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;
}


button:hover {

    background: #7dd3fc;
}


/* ==========================================================
   MOBILE
========================================================== */

@media (max-width: 800px) {

    .form-grid {

        grid-template-columns: 1fr;
    }


    .summary {

        grid-template-columns:
            1fr 1fr;
    }


    .navbar {

        padding: 0 5%;
    }

}


@media (max-width: 500px) {

    .summary {

        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<!-- ========================================================
     NAVBAR
======================================================== -->

<nav class="navbar">

<!-- ========================================================

<div class="container">


    <h1>

                        <select

<!-- ==========================================================
     JAVASCRIPT
========================================================== -->

<script>


// ==========================================================
// PROJECT TYPE - OTHER
// ==========================================================

const projectType =
    document.getElementById(
        "Project_Type"
    );


const projectTypeOtherBox =
    document.getElementById(
        "projectTypeOtherBox"
    );


const projectTypeOther =
    document.getElementById(
        "Project_Type_Other"
    );


projectType.addEventListener(
    "change",
    function () {

        if (
            this.value === "Others"
        ) {

            projectTypeOtherBox.style.display =
                "block";

            projectTypeOther.required =
                true;

        } else {

            projectTypeOtherBox.style.display =
                "none";

            projectTypeOther.required =
                false;

            projectTypeOther.value =
                "";
        }

        calculateComplexity();
    }
);


// ==========================================================
// METHODOLOGY - OTHER
// ==========================================================

const methodology =
    document.getElementById(
        "Methodology_Used"
    );


const methodologyOtherBox =
    document.getElementById(
        "methodologyOtherBox"
    );


const methodologyOther =
    document.getElementById(
        "Methodology_Used_Other"
    );


methodology.addEventListener(
    "change",
    function () {

        if (
            this.value === "Others"
        ) {

            methodologyOtherBox.style.display =
                "block";

            methodologyOther.required =
                true;

        } else {

            methodologyOtherBox.style.display =
                "none";

            methodologyOther.required =
                false;

            methodologyOther.value =
                "";
        }

        calculateComplexity();
    }
);


// ==========================================================
// DATE -> TIMELINE
// ==========================================================

const startDate =
    document.getElementById(
        "Start_Date"
    );


const endDate =
    document.getElementById(
        "End_Date"
    );


const timelineDisplay =
    document.getElementById(
        "Estimated_Timeline_Display"
    );


function updateTimeline() {

    if (
        !startDate.value ||
        !endDate.value
    ) {

        timelineDisplay.value =
            "0 months";

        calculateComplexity();

        return;
    }


    const start =
        new Date(
            startDate.value
        );


    const end =
        new Date(
            endDate.value
        );


    if (end < start) {

        timelineDisplay.value =
            "Invalid dates";

        calculateComplexity();

        return;
    }


    const milliseconds =
        end - start;


    const days =
        milliseconds /
        (
            1000 *
            60 *
            60 *
            24
        );


    const months =
        days / 30.4375;


    timelineDisplay.value =
        months.toFixed(2) +
        " months";


    calculateComplexity();
}


startDate.addEventListener(
    "change",
    updateTimeline
);


endDate.addEventListener(
    "change",
    updateTimeline
);


// ==========================================================
// TASK CALCULATIONS
// ==========================================================

const totalTasks =
    document.getElementById(
        "Total_Tasks"
    );


const completedTasks =
    document.getElementById(
        "Completed_Tasks"
    );


const overdueTasks =
    document.getElementById(
        "Overdue_Tasks"
    );


const pendingTasks =
    document.getElementById(
        "Pending_Tasks"
    );


const completionPercentage =
    document.getElementById(
        "Completion_Percentage"
    );


const delayPercentage =
    document.getElementById(
        "Delay_Percentage"
    );


const projectProgress =
    document.getElementById(
        "Project_Progress"
    );


function updateTaskValues() {

    const total =
        Number(
            totalTasks.value
        ) || 0;


    const completed =
        Number(
            completedTasks.value
        ) || 0;


    const overdue =
        Number(
            overdueTasks.value
        ) || 0;


    const pending =
        Math.max(
            0,
            total - completed
        );


    pendingTasks.textContent =
        pending;


    let completion = 0;


    if (total > 0) {

        completion =
            (
                completed /
                total
            ) * 100;
    }


    completion =
        Math.min(
            Math.max(
                completion,
                0
            ),
            100
        );


    completionPercentage.textContent =
        completion.toFixed(2) +
        "%";


    let delay = 0;


    if (total > 0) {

        delay =
            (
                overdue /
                total
            ) * 100;
    }


    delay =
        Math.min(
            Math.max(
                delay,
                0
            ),
            100
        );


    delayPercentage.textContent =
        delay.toFixed(2) +
        "%";


    if (completion <= 33) {

        projectProgress.textContent =
            "Not Started";

    }

    else if (
        completion > 66
    ) {

        projectProgress.textContent =
            "Completed";

    }

    else {

        projectProgress.textContent =
            "In Progress";
    }


    calculateComplexity();
}


// ==========================================================
// AUTOMATIC COMPLEXITY
// ==========================================================

const complexityScore =
    document.getElementById(
        "Complexity_Score"
    );


function calculateComplexity() {

    if (!complexityScore) {

        return;
    }


    // ======================================================
    // PROJECT TYPE
    // ======================================================

    const projectTypeValue =
        projectType.value;


    const projectTypeScores = {

        "Construction": 0.75,
        "Healthcare": 0.70,
        "IT": 0.60,
        "Manufacturing": 0.70,
        "Marketing": 0.35,
        "R&D": 0.85
    };


    let typeScore =
        projectTypeScores[
            projectTypeValue
        ] || 0.55;


    if (
        projectTypeValue === "Others"
    ) {

        typeScore = 0.60;
    }


    // ======================================================
    // METHODOLOGY
    // ======================================================

    const methodologyValue =
        methodology.value;


    const methodologyScores = {

        "Agile": 0.55,
        "Hybrid": 0.65,
        "Kanban": 0.45,
        "Scrum": 0.55,
        "Waterfall": 0.40
    };


    let methodologyScore =
        methodologyScores[
            methodologyValue
        ] || 0.55;


    if (
        methodologyValue === "Others"
    ) {

        methodologyScore = 0.55;
    }


    // ======================================================
    // TEAM SIZE
    // ======================================================

    const teamSize =
        Number(
            document.getElementById(
                "Team_Size"
            ).value
        ) || 0;


    const teamScore =
        Math.min(
            teamSize / 40,
            1
        );


    // ======================================================
    // BUDGET
    // ======================================================

    const budget =
        Number(
            document.getElementById(
                "Project_Budget_USD"
            ).value
        ) || 0;


    const budgetScore =
        Math.min(
            budget / 250000,
            1
        );


    // ======================================================
    // TIMELINE
    // ======================================================

    const timelineText =
        timelineDisplay.value;


    const timeline =
        parseFloat(
            timelineText
        ) || 0;


    const timelineScore =
        Math.min(
            timeline / 12,
            1
        );


    // ======================================================
    // STAKEHOLDERS
    // ======================================================

    const stakeholders =
        Number(
            document.getElementById(
                "Stakeholder_Count"
            ).value
        ) || 0;


    const stakeholderScore =
        Math.min(
            stakeholders / 40,
            1
        );


    // ======================================================
    // TEAM EXPERIENCE
    // ======================================================

    const teamExperience =
        document.getElementById(
            "Team_Experience_Level"
        ).value;


    const teamExperienceScores = {

        "Junior": 0.90,
        "Mixed": 0.65,
        "Senior": 0.35,
        "Expert": 0.20
    };


    const teamExperienceScore =
        teamExperienceScores[
            teamExperience
        ] || 0.55;


    // ======================================================
    // PM EXPERIENCE
    // ======================================================

    const pmExperience =
        document.getElementById(
            "Project_Manager_Experience"
        ).value;


    const pmScores = {

        "Junior PM": 0.90,
        "Mid-level PM": 0.60,
        "Senior PM": 0.30,
        "Certified PM": 0.20
    };


    const pmScore =
        pmScores[
            pmExperience
        ] || 0.55;


    // ======================================================
    // PROJECT PHASE
    // ======================================================

    const phase =
        document.getElementById(
            "Project_Phase"
        ).value;


    const phaseScores = {

        "Initiation": 0.35,
        "Planning": 0.55,
        "Execution": 0.80,
        "Monitoring": 0.70,
        "Closure": 0.30
    };


    const phaseScore =
        phaseScores[
            phase
        ] || 0.55;


    // ======================================================
    // REQUIREMENT STABILITY
    // ======================================================

    const requirement =
        document.getElementById(
            "Requirement_Stability"
        ).value;


    const requirementScores = {

        "Stable": 0.20,
        "Moderate": 0.55,
        "Volatile": 0.90
    };


    const requirementScore =
        requirementScores[
            requirement
        ] || 0.55;


    // ======================================================
    // TECHNOLOGY
    // ======================================================

    const technology =
        document.getElementById(
            "Technology_Familiarity"
        ).value;


    const technologyScores = {

        "New": 0.90,
        "Familiar": 0.50,
        "Expert": 0.20
    };


    const technologyScore =
        technologyScores[
            technology
        ] || 0.55;


    // ======================================================
    // RESOURCE AVAILABILITY
    // ======================================================

    const resource =
        document.getElementById(
            "Resource_Availability"
        ).value;


    const resourceScores = {

        "Low": 0.90,
        "Medium": 0.55,
        "High": 0.20
    };


    const resourceScore =
        resourceScores[
            resource
        ] || 0.55;


    // ======================================================
    // CHANGE REQUESTS
    // ======================================================

    const changeRequests =
        Number(
            document.getElementById(
                "Change_Request_Frequency"
            ).value
        ) || 0;


    const changeScore =
        Math.min(
            changeRequests / 20,
            1
        );


    // ======================================================
    // TASKS
    // ======================================================

    const total =
        Number(
            totalTasks.value
        ) || 0;


    const completed =
        Number(
            completedTasks.value
        ) || 0;


    const overdue =
        Number(
            overdueTasks.value
        ) || 0;


    const taskScore =
        Math.min(
            total / 200,
            1
        );


    let overdueScore = 0;


    if (total > 0) {

        overdueScore =
            Math.min(
                overdue / total,
                1
            );
    }


    let completionFactor = 1;


    if (total > 0) {

        completionFactor =
            1 -
            Math.min(
                completed / total,
                1
            );
    }


    // ======================================================
    // ESTIMATED EFFORT
    // ======================================================

    const estimatedEffort =
        Number(
            document.getElementById(
                "Estimated_Effort_Days"
            ).value
        ) || 0;


    const estimatedEffortScore =
        Math.min(
            estimatedEffort / 1000,
            1
        );


    // ======================================================
    // ACTUAL EFFORT
    // ======================================================

    const actualEffort =
        Number(
            document.getElementById(
                "Actual_Effort_Days"
            ).value
        ) || 0;


    let actualEffortScore = 0.5;


    if (
        actualEffort > 0 &&
        estimatedEffort > 0
    ) {

        const ratio =
            actualEffort /
            estimatedEffort;


        actualEffortScore =
            Math.min(
                ratio / 2,
                1
            );

    }

    else if (
        actualEffort > 0
    ) {

        actualEffortScore =
            Math.min(
                actualEffort / 1000,
                1
            );
    }


    // ======================================================
    // WEIGHTED SCORE
    // ======================================================

    const weightedScore =

          typeScore * 0.06

        + methodologyScore * 0.04

        + teamScore * 0.06

        + budgetScore * 0.06

        + timelineScore * 0.08

        + stakeholderScore * 0.05

        + teamExperienceScore * 0.05

        + pmScore * 0.05

        + phaseScore * 0.04

        + requirementScore * 0.08

        + changeScore * 0.08

        + technologyScore * 0.08

        + resourceScore * 0.08

        + taskScore * 0.05

        + overdueScore * 0.04

        + completionFactor * 0.03

        + estimatedEffortScore * 0.04

        + actualEffortScore * 0.03;


    // ======================================================
    // FINAL SCORE 1-10
    // ======================================================

    let score =
        Math.round(
            1 +
            (
                weightedScore *
                9
            )
        );


    score =
        Math.max(
            1,
            Math.min(
                10,
                score
            )
        );


    complexityScore.value =
        score;
}


// ==========================================================
// INPUT EVENT LISTENERS FOR COMPLEXITY
// ==========================================================

const complexityFields = [

    "Team_Size",

    "Project_Budget_USD",

    "Stakeholder_Count",

    "Team_Experience_Level",

    "Project_Manager_Experience",

    "Project_Phase",

    "Requirement_Stability",

    "Technology_Familiarity",

    "Resource_Availability",

    "Change_Request_Frequency",

    "Total_Tasks",

    "Completed_Tasks",

    "Overdue_Tasks",

    "Estimated_Effort_Days",

    "Actual_Effort_Days"
];


complexityFields.forEach(
    function (id) {

        const element =
            document.getElementById(
                id
            );


        if (element) {

            element.addEventListener(
                "input",
                calculateComplexity
            );


            element.addEventListener(
                "change",
                calculateComplexity
            );
        }

    }
);


// ==========================================================
// TASK EVENTS
// ==========================================================

totalTasks.addEventListener(
    "input",
    updateTaskValues
);


completedTasks.addEventListener(
    "input",
    updateTaskValues
);


overdueTasks.addEventListener(
    "input",
    updateTaskValues
);


// ==========================================================
// FORM VALIDATION
// ==========================================================

document
    .getElementById(
        "riskForm"
    )
    .addEventListener(
        "submit",
        function (event) {


            const total =
                Number(
                    totalTasks.value
                ) || 0;


            const completed =
                Number(
                    completedTasks.value
                ) || 0;


            const overdue =
                Number(
                    overdueTasks.value
                ) || 0;


            if (
                completed > total
            ) {

                event.preventDefault();


                alert(
                    "Completed Tasks cannot be greater than Total Tasks."
                );


                return;
            }


            if (
                overdue > total
            ) {

                event.preventDefault();


                alert(
                    "Overdue Tasks cannot be greater than Total Tasks."
                );


                return;
            }


            if (
                endDate.value <
                startDate.value
            ) {

                event.preventDefault();


                alert(
                    "End Date cannot be before Start Date."
                );


                return;
            }


            // Make sure complexity is calculated
            // immediately before submission.

            calculateComplexity();

        }
    );


// ==========================================================
// INITIAL CALCULATION
// ==========================================================

updateTaskValues();

calculateComplexity();

</script>
